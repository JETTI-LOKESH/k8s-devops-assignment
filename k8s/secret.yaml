apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: hello-app
  labels:
    app.kubernetes.io/part-of: hello-app
type: Opaque
data:
  # Base64-encoded values for LOCAL DEMO only.
  # In production: use Azure Key Vault + External Secrets Operator or
  # Sealed Secrets — never commit real credentials to source control.
  #
  # Encode with: echo -n "changeme" | base64
  DB_PASSWORD: Y2hhbmdlbWU=
  POSTGRES_PASSWORD: Y2hhbmdlbWU=
