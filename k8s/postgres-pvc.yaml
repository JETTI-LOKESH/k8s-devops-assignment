apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: hello-app
  labels:
    app: postgres
    app.kubernetes.io/part-of: hello-app
spec:
  accessModes:
    - ReadWriteOnce       # Single-node; RWO is sufficient for this architecture
  resources:
    requests:
      storage: 1Gi        # Sized for local demo; scale up for production workloads
