apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: hello-app
  labels:
    app: postgres
    tier: database
    app.kubernetes.io/part-of: hello-app
spec:
  selector:
    app: postgres
  type: ClusterIP   # Database is internal-only; never exposed outside the cluster
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
