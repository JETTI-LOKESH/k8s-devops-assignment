apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Pull the official Metrics Server release manifest
resources:
  - https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

patches:
  # Kind clusters use self-signed kubelet certificates.
  # This patch adds --kubelet-insecure-tls so Metrics Server can scrape
  # node metrics without a valid TLS chain.
  # NOTE: Remove this flag in production — use proper cert management instead.
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
    target:
      kind: Deployment
      name: metrics-server
      namespace: kube-system
