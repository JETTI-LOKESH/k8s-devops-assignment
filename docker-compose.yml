# docker-compose.yml
# Used for:
#   1. Local development without Kubernetes
#   2. CI/CD smoke tests inside GitHub Actions runners
#
# Note: Passwords here are for local-only demo use.
#       Never use plain-text secrets in production compose files.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: changeme
      # Store data in a subdirectory to avoid initdb errors when the
      # named volume contains a lost+found entry on first mount.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: hello-app:latest
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: changeme
      PORT: "5000"
      FLASK_DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
