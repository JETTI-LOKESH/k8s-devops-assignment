apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: hello-app
  labels:
    app.kubernetes.io/part-of: hello-app
data:
  # Database connection settings (non-sensitive)
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "appdb"
  DB_USER: "appuser"
  # Application settings
  PORT: "5000"
  FLASK_DEBUG: "false"
